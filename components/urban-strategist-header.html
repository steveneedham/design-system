<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Strategist Header</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      background: #14171C;
      color: #EDEAE2;
    }

    .urban-strategist-header {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .header-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://raw.githubusercontent.com/steveneedham/design-system/main/assets/headers/urban-strategist-map.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      opacity: 0.15;
      z-index: 1;
    }

    .header-scrim {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(20,23,28,0.88) 0%, rgba(20,23,28,0.80) 50%, rgba(20,23,28,0.88) 100%);
      z-index: 2;
    }

    .header-content {
      position: relative;
      z-index: 3;
      text-align: center;
      max-width: 90vw;
      padding: 2rem;
    }

    .header-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8B93A1;
      margin-bottom: 2rem;
      display: block;
    }

    .header-mark {
      margin-bottom: 2.5rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-mark svg { max-height: 100%; width: auto; }

    .header-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: 500;
      line-height: 1.15;
      margin-bottom: 1.5rem;
      color: #EDEAE2;
      letter-spacing: -0.02em;
    }

    .header-title .accent {
      color: #E8A33D;
      font-weight: 600;
    }

    .header-tagline {
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      line-height: 1.7;
      color: #8B93A1;
      margin-bottom: 3rem;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    .header-ctas {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .header-ctas a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 1.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 6px;
      border: 2px solid;
      transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .header-ctas a.primary {
      background: #E8A33D;
      color: #14171C;
      border-color: #E8A33D;
    }

    .header-ctas a.primary:hover {
      background: transparent;
      color: #E8A33D;
      box-shadow: 0 0 24px rgba(232, 163, 61, 0.4);
      transform: translateY(-2px);
    }

    .header-ctas a.secondary {
      background: transparent;
      color: #4FD1C5;
      border-color: #4FD1C5;
    }

    .header-ctas a.secondary:hover {
      background: #4FD1C5;
      color: #14171C;
      box-shadow: 0 0 24px rgba(79, 209, 197, 0.4);
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .header-title { font-size: clamp(2rem, 8vw, 3rem); }
      .header-tagline { font-size: 1rem; margin-bottom: 2rem; }
      .header-ctas { gap: 0.75rem; }
      .header-ctas a { padding: 0.75rem 1.25rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<header class="urban-strategist-header">
  <div class="header-background"></div>
  <div class="header-scrim"></div>

  <div class="header-content">
    <span class="header-eyebrow">Operations & Systems</span>

    <div class="header-mark">
      <svg viewBox="0 0 120 48" xmlns="http://www.w3.org/2000/svg">
        <text x="60" y="32" font-family="Fraunces" font-size="28" font-weight="500" text-anchor="middle" fill="#E8A33D">us</text>
      </svg>
    </div>

    <h1 class="header-title">
      <span class="accent">urban</span> strategist
    </h1>

    <p class="header-tagline">
      Field operations leadership meets hands-on systems work. Building the dashboards, playbooks, and automation that make operations legible.
    </p>

    <div class="header-ctas">
      <a href="#contact" class="primary">Get in touch</a>
      <a href="#work" class="secondary">View work</a>
    </div>
  </div>
</header>

</body>
</html>

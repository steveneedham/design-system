<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Clock ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#4DD0E1" stroke-width="4"/>
  <!-- Hour markers -->
  <circle cx="32" cy="6" r="2" fill="#718096"/>
  <circle cx="58" cy="32" r="2" fill="#718096"/>
  <circle cx="32" cy="58" r="2" fill="#718096"/>
  <circle cx="6" cy="32" r="2" fill="#718096"/>
  <!-- Hour hand -->
  <line x1="32" y1="32" x2="32" y2="16" stroke="#FFC857" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="32" y1="32" x2="46" y2="32" stroke="#FFC857" stroke-width="3" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="2.5" fill="#718096"/>
</svg>
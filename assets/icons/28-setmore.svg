<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Calendar grid background -->
  <rect x="12" y="14" width="40" height="40" rx="3" fill="none" stroke="#718096" stroke-width="2.5"/>
  <!-- Calendar header -->
  <line x1="12" y1="26" x2="52" y2="26" stroke="#718096" stroke-width="2"/>
  <!-- Day columns -->
  <line x1="19" y1="14" x2="19" y2="54" stroke="#718096" stroke-width="1.5" opacity="0.5"/>
  <line x1="26" y1="14" x2="26" y2="54" stroke="#718096" stroke-width="1.5" opacity="0.5"/>
  <line x1="33" y1="14" x2="33" y2="54" stroke="#718096" stroke-width="1.5" opacity="0.5"/>
  <line x1="40" y1="14" x2="40" y2="54" stroke="#718096" stroke-width="1.5" opacity="0.5"/>
  <line x1="47" y1="14" x2="47" y2="54" stroke="#718096" stroke-width="1.5" opacity="0.5"/>
  <!-- Week rows -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#718096" stroke-width="1.5" opacity="0.5"/>
  <line x1="12" y1="40" x2="52" y2="40" stroke="#718096" stroke-width="1.5" opacity="0.5"/>
  <!-- Clock/time indicator -->
  <circle cx="28" cy="20" r="3.5" fill="#4DD0E1"/>
  <!-- Checkmark accent -->
  <path d="M 40 44 L 44 48 L 50 42" fill="none" stroke="#FFC857" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
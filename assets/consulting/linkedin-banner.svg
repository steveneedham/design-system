<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .word { font-family:'Fraunces', serif; font-weight:500; fill:#EDEAE2; }
      .word-i { font-family:'Fraunces', serif; font-weight:500; font-style:italic; fill:#4FD1C5; }
      .mono-amber { font-family:'JetBrains Mono', monospace; font-weight:500; fill:#E8A33D; letter-spacing:6px; }
      .mono-muted { font-family:'JetBrains Mono', monospace; font-weight:400; fill:#EDEAE2; fill-opacity:0.55; letter-spacing:2px; }
    </style>
  </defs>

  <rect width="1584" height="396" fill="#14171C"/>

  <!-- faint hairline route motif running the width of the banner, safe-zone aware -->
  <path d="M -40,320 C 250,220 500,340 760,240 C 1020,140 1300,260 1620,150"
        fill="none" stroke="#EDEAE2" stroke-opacity="0.10" stroke-width="2"/>

  <!-- node cluster echoing the mark, kept inside LinkedIn's safe zone -->
  <g>
    <circle cx="180" cy="150" r="7" fill="#E8A33D"/>
    <circle cx="230" cy="185" r="7" fill="#4FD1C5"/>
    <circle cx="280" cy="128" r="10" fill="none" stroke="#EDEAE2" stroke-width="2.25"/>
    <path d="M180,150 L230,185 L280,128" fill="none" stroke="#EDEAE2" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark, kept within LinkedIn's centered safe area (roughly x 396–1188) -->
  <text x="396" y="205" class="word" font-size="52">Steven Needham</text>
  <text x="396" y="242" class="word-i" font-size="24">urban strategist</text>
  <text x="396" y="278" class="mono-amber" font-size="13">OPS</text>
  <text x="450" y="278" class="mono-muted" font-size="13">·</text>
  <text x="465" y="278" class="mono-amber" font-size="13">SYSTEMS</text>
  <text x="565" y="278" class="mono-muted" font-size="13">·</text>
  <text x="580" y="278" class="mono-amber" font-size="13">CIVIC TECH</text>
</svg>
